spring.application.name=ebankbot
server.port=8058

spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.jersey.enabled=false

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4

spring.ai.mcp.client.streamable-http.connections.customer.url=http://localhost:8056/mcp
spring.ai.mcp.client.streamable-http.connections.account.url=http://localhost:8057/mcp

discord.token=${DISCORD_TOKEN:}
telegram.api.key=${TELEGRAM_BOT_TOKEN:}
